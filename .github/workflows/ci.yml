name: CI

# image-edit: install limpio reproducible desde el lock + selftest completo.
# Valida A1 (instalacion limpia) en cada push/PR a main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Instalar desde lock con hashes
        run: >
          python -m pip install --require-hashes -r requirements.lock.txt
          --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Selftest (5 checks, incluye inferencia LaMa CPU)
        run: python cli.py selftest
        timeout-minutes: 15
